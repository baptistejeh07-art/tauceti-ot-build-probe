# Variant A: check out Tau Ceti at a pinned commit and build, inside its own tree, every module of
# TauCeti/MeasureTheory/OptimalTransport (and, through Lake, the Tau Ceti modules they import),
# from source. Mathlib's prebuilt files come from Mathlib's cache; Tau Ceti's own cache is not used,
# so every Tau Ceti module in the import closure is compiled by this job.
#
# This file has never been run. Each step names its source in README.md, "Sources".
name: ot-from-source

on:
  workflow_dispatch:
    inputs:
      build_minutes:
        description: "Time limit for the lake build step, in minutes (the job itself stops at 355)"
        required: false
        default: "300"

permissions:
  contents: read

env:
  TAUCETI_REPO: TauCetiProject/TauCeti
  TAUCETI_REV: aa1b4e9e2a25944efe7815c1898fb9fd5e879c11
  LEAN_TOOLCHAIN: leanprover/lean4:v4.37.0-rc1
  MATHLIB_REV: 31ce06eaadf4a200c0e1407c5f10953cf606b8f8
  ELAN_VERSION: v4.2.3
  ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub-hosted jobs are limited to 6 hours (360 minutes); stop a little earlier.
    timeout-minutes: 355
    steps:
      - name: Check out this repository (helper scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: helper

      - name: Prepare the report directory and record the machine
        run: |
          echo "REPORT_DIR=$RUNNER_TEMP/ot-report" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ot-report"
          bash helper/ci/runner-info.sh "$RUNNER_TEMP/ot-report/runner.txt"

      - name: Check out Tau Ceti at the pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TauCetiProject/TauCeti
          ref: aa1b4e9e2a25944efe7815c1898fb9fd5e879c11
          fetch-depth: 1
          # Lean runs code while it elaborates; keep no token in the checkout.
          persist-credentials: false
          path: tauceti

      - name: Check the pins (commit, toolchain, Mathlib revision in the manifest)
        run: |
          python3 helper/ci/check_pins.py \
            --toolchain-file tauceti/lean-toolchain --expect-toolchain "$LEAN_TOOLCHAIN" \
            --git-dir tauceti --expect-git "$TAUCETI_REV" \
            --manifest tauceti/lake-manifest.json --expect-package "mathlib=$MATHLIB_REV" \
            | tee "$REPORT_DIR/pins.txt"

      - name: Raise vm.max_map_count (as Tau Ceti's own CI does)
        run: |
          sudo -n sysctl -w vm.max_map_count=1048576 || echo "::warning::could not raise vm.max_map_count"
          cat /proc/sys/vm/max_map_count

      - name: Install elan (pinned, checksum verified) and the toolchain
        working-directory: tauceti
        run: bash ../helper/ci/timed.sh install-elan bash ../helper/ci/install-elan.sh

      - name: Fetch Mathlib's prebuilt files (lake exe cache get, then get! on failure)
        working-directory: tauceti
        run: |
          bash ../helper/ci/timed.sh cache-get bash -c 'lake exe cache get || lake exe cache get!'
          df -Pk . | tee "$REPORT_DIR/disk-after-cache.txt"

      - name: List the modules of the optimal transport layer
        run: bash helper/ci/list-targets.sh tauceti "" "$REPORT_DIR/targets.txt"

      - name: Build the layer from source
        # The step limit is a second guard; build.sh stops lake build itself at build_minutes.
        timeout-minutes: 340
        env:
          BUILD_MINUTES: ${{ inputs.build_minutes || '300' }}
        run: |
          case "$BUILD_MINUTES" in (''|*[!0-9]*) echo "build_minutes must be an integer"; exit 1;; esac
          bash helper/ci/timed.sh lake-build \
            bash helper/ci/build.sh tauceti "$REPORT_DIR/targets.txt" "$BUILD_MINUTES" "$REPORT_DIR"

      - name: Write the report
        if: ${{ !cancelled() }}
        run: bash helper/ci/report.sh "$REPORT_DIR" tauceti ot-from-source

      - name: Upload the report and the build log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ot-build-report-from-source
          path: ${{ runner.temp }}/ot-report
          if-no-files-found: error
          retention-days: 30

      - name: Fail the job if the build failed
        if: ${{ !cancelled() }}
        run: |
          code="$(grep -m1 '^exit_code=' "$REPORT_DIR/build-status.txt" | cut -d= -f2)"
          echo "lake build exit code: ${code:-missing}"
          test "${code:-1}" = "0"
